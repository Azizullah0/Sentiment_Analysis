name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  url-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run YouTube URL unit tests
        run: |
          pip install -q pytest
          python -m pytest tests/test_youtube_urls.py -q
